<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City: Underworld</title>
<style>
@font-face{font-family:'Anton';src:url(fonts/Anton.ttf) format('truetype')}
@font-face{font-family:'Bebas Neue';src:url(fonts/BebasNeue.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:500;src:url(fonts/Montserrat-500.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:700;src:url(fonts/Montserrat-700.ttf) format('truetype')}
@font-face{font-family:'Montserrat';font-weight:900;src:url(fonts/Montserrat-900.ttf) format('truetype')}
html,body{margin:0;background:#07030d;min-height:100%}
canvas{display:block;width:min(100vw,66.667vh);height:auto;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Procedurally painted poster. Everything below is drawn in a 1600x2400 logical space;
// ?s=2 renders at 3200x4800.
const W = 1600, H = 2400;
const S = Math.max(1, Math.min(3, +(new URLSearchParams(location.search).get('s') || 1)));
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext('2d');
const base = c => c.setTransform(S, 0, 0, S, 0, 0);
base(ctx);

const HZ = 1180;                 // horizon
const SUN = { x: 800, y: 1150 };
const CAMH = 1.45;               // camera height in metres
const pxPerM = gy => (gy - HZ) / CAMH;

// ---------- utilities ----------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry32(1337);
const seed = s => { rnd = mulberry32(s); };
const R = (a, b) => a + (b - a) * rnd();
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function gauss() { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }
function mkCanvas(w = W * S, h = H * S) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const perm = new Uint8Array(512);
{ const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) perm[i] = p[i & 255]; }
const hash = (x, y) => perm[(perm[x & 255] + (y & 255)) & 511] / 255;
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 5) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); n += a; a *= 0.5; f *= 2.03; } return s / n; }

// Catmull-Rom through points; a third element of 1 marks a sharp corner.
function smooth(c, pts, closed = true) {
  const n = pts.length, get = i => closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)];
  c.moveTo(pts[0][0], pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const c1 = p1[2] ? [p1[0], p1[1]] : [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = p2[2] ? [p2[0], p2[1]] : [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    c.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], p2[0], p2[1]);
  }
  if (closed) c.closePath();
}
function glow(c, x, y, r, col, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.22, rgba(col, a * 0.42)); g.addColorStop(0.55, rgba(col, a * 0.1)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.fillRect(x - r, y - r, 2 * r, 2 * r);
}
const LAYERS = [mkCanvas(), mkCanvas(), mkCanvas(), mkCanvas()];
function layer(i) {
  const x = LAYERS[i].getContext('2d');
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; x.filter = 'none'; x.shadowBlur = 0;
  x.clearRect(0, 0, W * S, H * S); base(x); return x;
}
function blit(c, src, alpha = 1, op = 'source-over', blur = 0) {
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = alpha; c.globalCompositeOperation = op;
  if (blur) c.filter = `blur(${blur * S}px)`; c.drawImage(src, 0, 0); c.restore();
}
const flares = [];

// ---------- sky ----------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HZ);
  [[0, '#0a051d'], [0.16, '#180a3b'], [0.33, '#3a125d'], [0.5, '#76196a'], [0.63, '#bd2b61'], [0.75, '#e85544'], [0.87, '#ff9045'], [0.95, '#ffc067'], [1, '#ffe0a0']]
    .forEach(([o, c]) => g.addColorStop(o, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ + 40);
  seed(11);
  for (let i = 0; i < 340; i++) {
    const x = R(0, W), y = Math.pow(rnd(), 1.8) * 640, a = (1 - y / 640) * R(0.15, 0.9), s = R(0.6, 1.9);
    ctx.fillStyle = `rgba(255,236,255,${a})`; ctx.fillRect(x, y, s, s);
  }
  ctx.globalCompositeOperation = 'lighter';
  const sg = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 1050);
  sg.addColorStop(0, 'rgba(255,214,150,0.6)'); sg.addColorStop(0.1, 'rgba(255,170,100,0.38)'); sg.addColorStop(0.32, 'rgba(255,90,110,0.16)'); sg.addColorStop(0.7, 'rgba(150,40,140,0.05)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sg; ctx.fillRect(0, 0, W, HZ + 40);
  ctx.globalCompositeOperation = 'source-over';
  const d = ctx.createRadialGradient(SUN.x, SUN.y, 0, SUN.x, SUN.y, 104);
  d.addColorStop(0, '#fffef6'); d.addColorStop(0.72, '#fff2c8'); d.addColorStop(0.9, '#ffd47e'); d.addColorStop(1, 'rgba(255,190,110,0)');
  ctx.fillStyle = d; ctx.beginPath(); ctx.arc(SUN.x, SUN.y, 104, 0, 7); ctx.fill();
}

function drawClouds() {
  const cw = 800, ch = 600, sc = 2;
  const off = mkCanvas(cw, ch), oc = off.getContext('2d'), img = oc.createImageData(cw, ch), d = img.data;
  const top = hex('#180a30'), mid = hex('#55195a'), low = hex('#a33d52');
  const pink = hex('#ff5a8c'), gold = hex('#ffd38c'), hot = hex('#fff1cc');
  for (let v = 0; v < ch; v++) {
    const Y = v * sc, yb = Y / 1200;
    const band = 0.62 * Math.exp(-(((yb - 0.2) / 0.12) ** 2)) + 0.55 * Math.exp(-(((yb - 0.47) / 0.1) ** 2)) + 0.4 * Math.exp(-(((yb - 0.74) / 0.07) ** 2)) + 0.32 * Math.exp(-(((yb - 0.915) / 0.022) ** 2));
    const bc = yb < 0.5 ? mix(top, mid, yb / 0.5) : mix(mid, low, (yb - 0.5) / 0.5);
    for (let u = 0; u < cw; u++) {
      const X = u * sc;
      const wx = fbm(X / 820 + 3.1, Y / 300 + 1.7, 3);
      const nx = X / 640 + wx * 1.5, ny = Y / 115 + wx * 0.9;
      const n = fbm(nx, ny, 6);
      const dens = sstep(0, 0.2, n + band * 0.4 - 0.6);
      if (dens <= 0.002) continue;
      const dx = SUN.x - X, dy = SUN.y - Y, dl = Math.hypot(dx, dy) + 1e-3;
      const n2 = fbm(nx + dx / dl * 0.05, ny + dy / dl * 0.2, 6);
      const lit = clamp(0.5 + (n - n2) * 7);
      const si = Math.exp(-dl / 540);
      let L = clamp(Math.pow(lit, 1.5) * (0.28 + 0.72 * si) + (1 - dens) * si * 0.9 + (1 - dens) * 0.12);
      let c = mix(bc, mix(pink, gold, clamp(si * 1.7)), L);
      if (si > 0.38) c = mix(c, hot, clamp((si - 0.38) * 1.3 * L));
      const i = (v * cw + u) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = dens * 238;
    }
  }
  oc.putImageData(img, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(off, 0, 0, cw * sc, ch * sc);
}

function godRays() {
  seed(21);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, HZ); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 52; i++) {
    const a = -Math.PI * R(0.03, 0.97), w = R(0.004, 0.026), len = R(700, 1600);
    const g = ctx.createRadialGradient(SUN.x, SUN.y, 70, SUN.x, SUN.y, len);
    g.addColorStop(0, `rgba(255,205,150,${R(0.04, 0.11)})`); g.addColorStop(1, 'rgba(255,110,130,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(SUN.x, SUN.y); ctx.arc(SUN.x, SUN.y, len, a - w, a + w); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// ---------- city ----------
const towerLights = [];
const NEON = ['#ff2e93', '#2ee6ff', '#b44dff', '#ff7a2e', '#3dffb0'];
function skylineProfile(cx) {
  return 0.5 + 1.05 * Math.exp(-(((cx - 1190) / 230) ** 2)) + 0.9 * Math.exp(-(((cx - 370) / 210) ** 2)) + 0.25 * Math.exp(-(((cx - 1500) / 120) ** 2));
}
function centreCut(cx) { const t = Math.abs(cx - SUN.x); return t < 105 ? 0.1 : t < 170 ? lerp(0.1, 1, (t - 105) / 65) : 1; }

function drawTower(t) {
  const { x, w, h } = t, top = HZ - h, cx = x + w / 2;
  const leftOfSun = cx < SUN.x;
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  const body = t.front ? '#170b24' : '#2a1238', lit = t.front ? '#5b2346' : '#6a2a4e';
  if (leftOfSun) { g.addColorStop(0, body); g.addColorStop(0.75, body); g.addColorStop(1, lit); }
  else { g.addColorStop(0, lit); g.addColorStop(0.25, body); g.addColorStop(1, body); }
  ctx.fillStyle = g;
  // crowns
  ctx.beginPath();
  if (t.type === 'spire') { ctx.moveTo(x, HZ + 2); ctx.lineTo(x, top); ctx.lineTo(x + w * 0.22, top); ctx.lineTo(cx, top - h * 0.16); ctx.lineTo(x + w * 0.78, top); ctx.lineTo(x + w, top); ctx.lineTo(x + w, HZ + 2); }
  else if (t.type === 'slant') { const hi = leftOfSun ? 0 : 1; ctx.moveTo(x, HZ + 2); ctx.lineTo(x, top + (hi ? h * 0.12 : 0)); ctx.lineTo(x + w, top + (hi ? 0 : h * 0.12)); ctx.lineTo(x + w, HZ + 2); }
  else if (t.type === 'curve') { ctx.moveTo(x, HZ + 2); ctx.lineTo(x, top + w * 0.3); ctx.quadraticCurveTo(cx, top - w * 0.35, x + w, top + w * 0.3); ctx.lineTo(x + w, HZ + 2); }
  else if (t.type === 'step') { ctx.moveTo(x, HZ + 2); ctx.lineTo(x, top + h * 0.12); ctx.lineTo(x + w * 0.15, top + h * 0.12); ctx.lineTo(x + w * 0.15, top + h * 0.05); ctx.lineTo(x + w * 0.3, top + h * 0.05); ctx.lineTo(x + w * 0.3, top); ctx.lineTo(x + w * 0.7, top); ctx.lineTo(x + w * 0.7, top + h * 0.05); ctx.lineTo(x + w * 0.85, top + h * 0.05); ctx.lineTo(x + w * 0.85, top + h * 0.12); ctx.lineTo(x + w, top + h * 0.12); ctx.lineTo(x + w, HZ + 2); }
  else ctx.rect(x, top, w, h + 2);
  ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  // glass picks up the sunset low down
  const r = ctx.createLinearGradient(0, top, 0, HZ);
  r.addColorStop(0, 'rgba(255,110,150,0.02)'); r.addColorStop(1, `rgba(255,140,90,${t.front ? 0.16 : 0.24})`);
  ctx.fillStyle = r; ctx.fillRect(x - 2, top - h * 0.2, w + 4, h * 1.3);
  // windows
  const colsN = Math.floor((w - 6) / 7), rowsN = Math.floor((h - 12) / 9);
  for (let ry = 0; ry < rowsN; ry++) {
    const floor = rnd() < 0.12 ? 0.85 : rnd() < 0.1 ? 0.0 : t.litP;
    for (let cx2 = 0; cx2 < colsN; cx2++) {
      if (rnd() > floor) continue;
      const warm = rnd() < 0.78;
      ctx.fillStyle = warm ? `rgba(255,${R(190, 225) | 0},${R(120, 170) | 0},${R(0.45, 0.95)})` : `rgba(${R(170, 210) | 0},230,255,${R(0.4, 0.85)})`;
      ctx.fillRect(x + 4 + cx2 * 7, top + 10 + ry * 9, 3.2, 4.6);
    }
  }
  ctx.restore();
  // neon trims
  if (t.neon) {
    const col = hex(t.neon);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.shadowColor = t.neon; ctx.shadowBlur = 14 * S; ctx.strokeStyle = rgba(mix(col, [255, 255, 255], 0.35), 0.95); ctx.lineWidth = 2;
    ctx.beginPath();
    if (t.type === 'spire') { ctx.moveTo(x + w * 0.22, top); ctx.lineTo(cx, top - h * 0.16); ctx.lineTo(x + w * 0.78, top); }
    else if (t.type === 'curve') { ctx.moveTo(x, top + w * 0.3); ctx.quadraticCurveTo(cx, top - w * 0.35, x + w, top + w * 0.3); }
    else { const ex = leftOfSun ? x + w - 1.5 : x + 1.5; ctx.moveTo(ex, top + 4); ctx.lineTo(ex, HZ - h * 0.25); }
    ctx.stroke();
    if (t.band) { ctx.beginPath(); ctx.moveTo(x, top + h * 0.06); ctx.lineTo(x + w, top + h * 0.06); ctx.stroke(); }
    ctx.restore();
    towerLights.push({ x: cx, col: t.neon, w });
  }
  if (t.type === 'spire') {
    ctx.strokeStyle = '#1b0d26'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, top - h * 0.16); ctx.lineTo(cx, top - h * 0.26); ctx.stroke();
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, cx, top - h * 0.26, 16, [255, 40, 40], 0.9); ctx.restore();
  }
}

function drawSkyline() {
  // far layer
  seed(77);
  let x = -10;
  ctx.fillStyle = '#93405f';
  while (x < W + 10) {
    const w = R(14, 46), cx = x + w / 2;
    const h = R(16, 100) * skylineProfile(cx) * centreCut(cx);
    ctx.globalAlpha = 0.78; ctx.fillRect(x, HZ - h, w + 1, h + 2);
    if (rnd() < 0.15) { ctx.fillRect(cx - 1, HZ - h - R(10, 30), 2, 30); }
    ctx.globalAlpha = 1;
    for (let k = 0; k < h / 6; k++) if (rnd() < 0.3) { ctx.fillStyle = 'rgba(255,220,170,0.55)'; ctx.fillRect(x + R(2, w - 3), HZ - R(4, h), 2, 2.5); ctx.fillStyle = '#93405f'; }
    x += w * R(0.7, 1.05);
  }
  const hz = ctx.createLinearGradient(0, HZ - 220, 0, HZ);
  hz.addColorStop(0, 'rgba(255,130,110,0)'); hz.addColorStop(1, 'rgba(255,150,100,0.5)');
  ctx.fillStyle = hz; ctx.fillRect(0, HZ - 220, W, 222);

  // mid layer
  seed(91);
  const towers = [];
  x = -30;
  while (x < W + 30) {
    const w = R(34, 90), cx = x + w / 2;
    const h = R(50, 210) * skylineProfile(cx) * centreCut(cx);
    towers.push({ x, w, h, type: ['flat', 'flat', 'slant', 'step', 'flat'][(rnd() * 5) | 0], litP: R(0.18, 0.38), neon: rnd() < 0.22 ? NEON[(rnd() * 5) | 0] : null });
    x += w * R(0.6, 1.0) + R(-4, 10);
  }
  towers.forEach(drawTower);
  const hz2 = ctx.createLinearGradient(0, HZ - 160, 0, HZ);
  hz2.addColorStop(0, 'rgba(255,120,120,0)'); hz2.addColorStop(1, 'rgba(255,130,100,0.28)');
  ctx.fillStyle = hz2; ctx.fillRect(0, HZ - 160, W, 162);

  // hero towers
  seed(5);
  const heroes = [
    { x: 30, w: 70, h: 250, type: 'step', neon: '#2ee6ff' },
    { x: 170, w: 86, h: 320, type: 'slant', neon: '#ff2e93', band: 1 },
    { x: 300, w: 72, h: 430, type: 'spire', neon: '#b44dff' },
    { x: 400, w: 98, h: 350, type: 'curve', neon: '#2ee6ff' },
    { x: 530, w: 62, h: 230, type: 'step', neon: '#ff7a2e' },
    { x: 980, w: 66, h: 240, type: 'slant', neon: '#3dffb0' },
    { x: 1060, w: 80, h: 340, type: 'step', neon: '#ff2e93', band: 1 },
    { x: 1150, w: 84, h: 470, type: 'spire', neon: '#2ee6ff' },
    { x: 1260, w: 112, h: 380, type: 'curve', neon: '#ff2e93' },
    { x: 1400, w: 78, h: 290, type: 'slant', neon: '#b44dff' },
    { x: 1500, w: 90, h: 250, type: 'step', neon: '#2ee6ff' },
  ];
  heroes.forEach(t => drawTower({ ...t, front: 1, litP: 0.34 }));

  // neon signs
  const sign = (txt, x, y, col, size, vertical) => {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.font = `700 ${size}px Montserrat`; ctx.textAlign = 'center';
    ctx.shadowColor = col; ctx.shadowBlur = 12 * S; ctx.fillStyle = rgba(mix(hex(col), [255, 255, 255], 0.45));
    if (vertical) [...txt].forEach((ch, i) => ctx.fillText(ch, x, y + i * size * 1.05)); else ctx.fillText(txt, x, y);
    ctx.restore();
  };
  sign('HOTEL', 214, 900, '#ff2e93', 15, true);
  sign('CORAL', 1452, 960, '#2ee6ff', 14, true);
  sign('CLUB 77', 1316, 870, '#ff7a2e', 15);
  sign('NOVA', 449, 900, '#3dffb0', 15);

  // far-shore palms and lights
  seed(33);
  const tinyPalm = (px, h) => {
    ctx.strokeStyle = '#2a0f22'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(px, HZ); ctx.quadraticCurveTo(px + 3, HZ - h * 0.5, px + R(-4, 4), HZ - h); ctx.stroke();
    const tx = px, ty = HZ - h; ctx.lineWidth = 1.3;
    for (let k = 0; k < 7; k++) { const a = -Math.PI * (k / 6) ; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo(tx + Math.cos(a) * h * 0.3, ty + Math.sin(a) * h * 0.2, tx + Math.cos(a) * h * 0.42, ty + h * 0.12); ctx.stroke(); }
  };
  for (let i = 0; i < 26; i++) { const px = rnd() < 0.5 ? R(0, 640) : R(960, 1600); tinyPalm(px, R(16, 34)); }
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 160; i++) { const px = R(0, W); if (Math.abs(px - 800) < 110) continue; glow(ctx, px, HZ - R(1, 6), R(3, 6), rnd() < 0.7 ? [255, 210, 150] : [120, 220, 255], 0.7); }
  ctx.restore();
}

function drawCauseway() {
  const y = x => lerp(1150, 1134, x / W);
  seed(44);
  ctx.fillStyle = '#1d0b1f';
  for (let x = -20; x < W + 40; x += 64) { ctx.fillRect(x, y(x), 5, 1192 - y(x)); }
  ctx.beginPath(); ctx.moveTo(-20, y(-20)); ctx.lineTo(W + 20, y(W + 20)); ctx.lineTo(W + 20, y(W + 20) + 9); ctx.lineTo(-20, y(-20) + 10); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,190,140,0.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-20, y(-20) - 3); ctx.lineTo(W + 20, y(W + 20) - 3); ctx.stroke();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const trail = (off, col, lw) => {
    ctx.shadowColor = col; ctx.shadowBlur = 10 * S; ctx.strokeStyle = col; ctx.lineWidth = lw;
    let x = -20;
    while (x < W + 20) { const l = R(60, 260); ctx.globalAlpha = R(0.5, 1); ctx.beginPath(); ctx.moveTo(x, y(x) + off); ctx.lineTo(x + l, y(x + l) + off); ctx.stroke(); x += l + R(10, 80); }
  };
  trail(-1, '#fff2c8', 1.6); trail(2.5, '#ff3a3a', 1.6);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  for (let x = 10; x < W; x += 52) { ctx.fillStyle = '#1d0b1f'; ctx.fillRect(x, y(x) - 16, 1.2, 14); glow(ctx, x + 0.6, y(x) - 16, 7, [255, 200, 130], 0.8); }
  ctx.restore();
}

function drawWater() {
  const y0 = HZ, y1 = 1448;

// ---------- palms ----------
function palm(c, bx, by, cx, cy, tx, ty, w0, w1, s) {
  seed(s);
  const N = 140, L = [], Rr = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, it = 1 - t;
    const px = it * it * bx + 2 * it * t * cx + t * t * tx, py = it * it * by + 2 * it * t * cy + t * t * ty;
    const dx = 2 * it * (cx - bx) + 2 * t * (tx - cx), dy = 2 * it * (cy - by) + 2 * t * (ty - cy), dl = Math.hypot(dx, dy);
    const nx = -dy / dl, ny = dx / dl, w = lerp(w0, w1, Math.pow(t, 0.7)) * (1 + 0.05 * Math.sin(t * 90)) / 2;
    L.push([px + nx * w, py + ny * w]); Rr.push([px - nx * w, py - ny * w]);
  }
  const tg = c.createLinearGradient(bx - w0, 0, bx + w0, 0);
  c.fillStyle = '#150910'; c.beginPath(); c.moveTo(...L[0]); L.forEach(p => c.lineTo(...p)); Rr.slice().reverse().forEach(p => c.lineTo(...p)); c.closePath(); c.fill();
  // rim from the sun side
  const sunSide = tx < SUN.x ? Rr : L;
  c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = 'rgba(255,150,110,0.55)'; c.lineWidth = 2.2; c.shadowColor = '#ff7a50'; c.shadowBlur = 8 * S;
  c.beginPath(); c.moveTo(...sunSide[0]); sunSide.forEach(p => c.lineTo(...p)); c.stroke(); c.restore();
  c.strokeStyle = 'rgba(0,0,0,0.5)'; c.lineWidth = 1.4;
  for (let i = 2; i < N; i += 2) { c.beginPath(); c.moveTo(...L[i]); c.quadraticCurveTo((L[i][0] + Rr[i][0]) / 2, (L[i][1] + Rr[i][1]) / 2 + 3, ...Rr[i]); c.stroke(); }
  // fronds
  const fronds = [];
  for (let k = 0; k < 17; k++) fronds.push(lerp(-Math.PI * 1.12, Math.PI * 0.12, k / 16) + R(-0.12, 0.12));
  fronds.sort(() => rnd() - 0.5);
  for (const a of fronds) frond(c, tx, ty, a, R(250, 430));
  c.fillStyle = '#0e050b';
  for (let k = 0; k < 6; k++) { c.beginPath(); c.arc(tx + R(-18, 18), ty + R(4, 22), R(8, 12), 0, 7); c.fill(); }
}
function frond(c, x, y, ang, len) {
  let px = x, py = y, dx = Math.cos(ang), dy = Math.sin(ang);
  const pts = [], n = 44, droop = R(0.035, 0.06);
  for (let i = 0; i <= n; i++) { pts.push([px, py, dx, dy]); px += dx * len / n; py += dy * len / n; dy += droop; const l = Math.hypot(dx, dy); dx /= l; dy /= l; }
  c.strokeStyle = '#13070f'; c.lineCap = 'round';
  c.lineWidth = 3.4; c.beginPath(); c.moveTo(x, y); pts.forEach(p => c.lineTo(p[0], p[1])); c.stroke();
  for (let i = 3; i <= n; i++) {
    const [qx, qy, ex, ey] = pts[i], t = i / n;
    const ll = len * 0.3 * Math.sin(Math.PI * Math.min(1, t * 1.1)) * (0.75 + 0.25 * rnd());
    for (const side of [-1, 1]) {
      let lx = -ey * side * 0.7 + ex * 0.5, ly = ex * side * 0.7 + ey * 0.5 + 0.75;
      const l = Math.hypot(lx, ly); lx /= l; ly /= l;
      c.lineWidth = 2.4 - t; c.beginPath(); c.moveTo(qx, qy);
      c.quadraticCurveTo(qx + lx * ll * 0.5 + ex * 6, qy + ly * ll * 0.4 - 4, qx + lx * ll, qy + ly * ll); c.stroke();
    }
  }
}

function poly(c, cx, gy, sc, pts, smoothIt = true) { const P = pts.map(p => [cx + p[0] * sc, gy + p[1] * sc, p[2]]); c.beginPath(); if (smoothIt) smooth(c, P); else { c.moveTo(P[0][0], P[0][1]); P.slice(1).forEach(p => c.lineTo(p[0], p[1])); c.closePath(); } }

function fogBand(y0, y1, col, alpha, s) {
  const w = 320, h = Math.ceil((y1 - y0) / 5), off = mkCanvas(w, h), oc = off.getContext('2d'), id = oc.createImageData(w, h);
  for (let v = 0; v < h; v++) for (let u = 0; u < w; u++) {
    const n = fbm(u / 40 + s, v / 6 + s * 2, 5), t = v / h, env = Math.sin(Math.PI * t);
    const a = sstep(0.38, 0.75, n) * env * alpha, i = (v * w + u) * 4;
    id.data[i] = col[0]; id.data[i + 1] = col[1]; id.data[i + 2] = col[2]; id.data[i + 3] = a * 255;
  }
  oc.putImageData(id, 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(off, 0, y0, W, y1 - y0); ctx.restore();
}

  const g = T.createLinearGradient(0, by - asc, 0, by);
  [[0, '#fff7dc'], [0.22, '#ffd56e'], [0.44, '#ff7a3d'], [0.5, '#ff3d6e'], [0.505, '#b0124f'], [0.6, '#d81b6a'], [0.82, '#ff4fa0'], [1, '#ffd0e6']].forEach(([o, col]) => g.addColorStop(o, col));
  T.fillStyle = g; T.fillText(txt, cx, by);
  T.globalCompositeOperation = 'source-atop';
  const sh = T.createLinearGradient(cx - 500, by - asc, cx - 200, by);
  sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, 'rgba(255,255,255,0.55)'); sh.addColorStop(1, 'rgba(255,255,255,0)');
  T.fillStyle = sh; T.fillRect(0, by - asc - 20, W, asc + 40);
  T.globalCompositeOperation = 'source-over';
  T.lineWidth = 2; T.strokeStyle = 'rgba(255,240,250,0.65)'; T.strokeText(txt, cx, by - 2);
  blit(ctx, LAYERS[0], 0.9, 'lighter', 26);
  blit(ctx, LAYERS[0], 1);

  // UNDERWORLD
  ctx.save();
  ctx.font = '112px "Bebas Neue"'; ctx.textAlign = 'center'; ctx.letterSpacing = '34px';
  const uy = 2268, uw = ctx.measureText('UNDERWORLD').width;
  ctx.shadowColor = '#2ee6ff'; ctx.shadowBlur = 30 * S;
  const ug = ctx.createLinearGradient(0, uy - 90, 0, uy); ug.addColorStop(0, '#ffffff'); ug.addColorStop(1, '#9ff3ff');
  ctx.fillStyle = ug; ctx.fillText('UNDERWORLD', cx + 17, uy);
  ctx.shadowBlur = 0;
  const lineY = uy - 42;
  for (const sd of [-1, 1]) {
    const x0 = cx + sd * (uw / 2 + 24), x1 = x0 + sd * 170;

    ctx.fillStyle = lg; ctx.fillRect(Math.min(x0, x1), lineY - 1.5, 170, 3);
    ctx.save(); ctx.translate(x0, lineY); ctx.rotate(Math.PI / 4); ctx.fillStyle = '#ff3c96'; ctx.fillRect(-6, -6, 12, 12); ctx.restore();
  }
  ctx.restore();
}

// ---------- post ----------
function bloom() {
  const w = Math.floor(W * S / 4), h = Math.floor(H * S / 4);
  const sm = mkCanvas(w, h), sc = sm.getContext('2d'); sc.drawImage(cv, 0, 0, w, h);
  const id = sc.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const l = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255; let k = clamp((l - 0.58) / 0.42); k *= k; d[i] *= k; d[i + 1] *= k; d[i + 2] *= k; }
  sc.putImageData(id, 0, 0);
  for (const [b, a] of [[3, 0.6], [12, 0.55], [36, 0.45]]) {
    const t = mkCanvas(w, h), tc = t.getContext('2d'); tc.filter = `blur(${b}px)`; tc.drawImage(sm, 0, 0);
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = a; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(t, 0, 0, W * S, H * S); ctx.restore();
  }
}
function drawFlares() {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const f of flares) {
    glow(ctx, f.x, f.y, f.r * 3, f.col, 0.6);
    ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1, 0.016);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, f.streak);
    g.addColorStop(0, rgba(mix(f.col, [255, 255, 255], 0.5), 0.55)); g.addColorStop(0.25, rgba(mix(f.col, [90, 150, 255], 0.5), 0.14)); g.addColorStop(1, rgba(f.col, 0));
    ctx.fillStyle = g; ctx.fillRect(-f.streak, -f.streak, f.streak * 2, f.streak * 2); ctx.restore();
  }
  // sun starburst + anamorphic line
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI + 0.2, len = i % 2 ? 260 : 420;
    ctx.save(); ctx.translate(SUN.x, SUN.y); ctx.rotate(a); ctx.scale(1, 0.012);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, len); g.addColorStop(0, 'rgba(255,240,200,0.5)'); g.addColorStop(1, 'rgba(255,200,150,0)');
    ctx.fillStyle = g; ctx.fillRect(-len, -len, len * 2, len * 2); ctx.restore();
  }
  ctx.save(); ctx.translate(SUN.x, SUN.y); ctx.scale(1, 0.01);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1300); g.addColorStop(0, 'rgba(255,230,190,0.7)'); g.addColorStop(0.3, 'rgba(255,150,120,0.22)'); g.addColorStop(1, 'rgba(255,120,120,0)');
  ctx.fillStyle = g; ctx.fillRect(-1300, -1300, 2600, 2600); ctx.restore();
  // lens ghosts along the sun-centre axis
  const ax = W / 2, ay = H * 0.42;
  [[-0.5, 50, [255, 120, 200], 0.08], [-0.9, 26, [120, 220, 255], 0.1], [-1.4, 90, [255, 170, 90], 0.05], [0.4, 34, [180, 120, 255], 0.07]].forEach(([t, r, col, a]) => {
    const gx = SUN.x + (ax - SUN.x) * (1 - t) * 2, gy = SUN.y + (ay - SUN.y) * (1 - t) * 2;
    glow(ctx, gx, gy, r, col, a);
  });
  ctx.restore();
}
function finishPixels() {
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  const w = W * S, h = H * S;
  const vg = ctx.createRadialGradient(w / 2, h * 0.47, w * 0.35, w / 2, h * 0.5, h * 0.72);
  vg.addColorStop(0, 'rgba(255,255,255,1)'); vg.addColorStop(1, 'rgba(70,50,90,1)');
  ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'source-over';
  const id = ctx.getImageData(0, 0, w, h), d = id.data, src = new Uint8ClampedArray(d);
  const g = mulberry32(4242);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, ox = Math.round((x - w / 2) / (w / 2) * 2.4 * S);
      const xr = clamp(x + ox, 0, w - 1), xb = clamp(x - ox, 0, w - 1);
      const n = (g() - 0.5) * 16;
      d[i] = src[(y * w + xr) * 4] + n; d[i + 1] = src[i + 1] + n; d[i + 2] = src[(y * w + xb) * 4 + 2] + n;
    }
  }
  ctx.putImageData(id, 0, 0);
  ctx.restore();
}

async function render() {

    { dx: 0, dy: 5, col: '#ffd99a', a: 0.95, blur: 0.8, glow: 0.4 }, { dx: 0, dy: 26, col: '#ffb070', a: 0.18, blur: 12, glow: 0 }];
